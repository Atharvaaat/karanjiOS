<!--
  karanjiOS 2.0 — a desktop environment in a single HTML file.
  Everything (styles, icons, apps) is inline. Files are stored in IndexedDB in this browser.
-->
<style>
/* ============ karanjiOS design system ============ */
:root {
  --font: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --accent: #3b82f6;
  --accent-rgb: 59,130,246;
  --accent-fg: #fff;
  --radius-s: 6px;
  --radius: 8px;
  --radius-l: 12px;
  --win-radius: 10px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur: 180ms;
  --fs: 13px;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16171a;
  --surface: #1f2024;
  --surface-2: #26272c;
  --surface-3: #2e3036;
  --sidebar: #1b1c20;
  --glass: rgba(30,31,36,.78);
  --glass-strong: rgba(28,29,33,.92);
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.14);
  --text: #ececef;
  --text-2: #a4a6ad;
  --text-3: #6f727a;
  --hover: rgba(255,255,255,.06);
  --active: rgba(255,255,255,.1);
  --shadow: 0 18px 50px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  --shadow-s: 0 6px 20px rgba(0,0,0,.4);
  --input: #141518;
  --scroll: rgba(255,255,255,.16);
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --surface-3: #eceef1;
  --sidebar: #f3f4f7;
  --glass: rgba(248,249,251,.78);
  --glass-strong: rgba(250,250,252,.94);
  --border: rgba(0,0,0,.08);
  --border-strong: rgba(0,0,0,.15);
  --text: #1c1d21;
  --text-2: #5b5e66;
  --text-3: #8c9098;
  --hover: rgba(0,0,0,.045);
  --active: rgba(0,0,0,.08);
  --shadow: 0 18px 50px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
  --shadow-s: 0 6px 20px rgba(0,0,0,.12);
  --input: #ffffff;
  --scroll: rgba(0,0,0,.2);
}
html.no-glass { --glass: var(--glass-strong); }
html.no-glass * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
html.no-anim *, html.no-anim *::before, html.no-anim *::after { transition: none !important; animation: none !important; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: var(--font); font-size: var(--fs); color: var(--text); background: #000;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  user-select: none; -webkit-user-select: none; font-feature-settings: "cv11", "ss01";
  line-height: 1.4;
}
input, textarea, select, button { font: inherit; color: inherit; }
button { cursor: default; background: none; border: none; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
.selectable, input, textarea, [contenteditable] { user-select: text; -webkit-user-select: text; }
::selection { background: rgba(var(--accent-rgb), .35); }

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px;
  border-radius: var(--radius-s); background: var(--surface-3); border: 1px solid var(--border);
  color: var(--text); font-weight: 500; white-space: nowrap; transition: background var(--dur), border-color var(--dur);
}
.btn:hover { background: var(--active); }
.btn:active { transform: translateY(.5px); }
.btn:focus-visible, .input:focus-visible, .ibtn:focus-visible { outline: 2px solid rgba(var(--accent-rgb), .6); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn:disabled, .ibtn:disabled { opacity: .4; pointer-events: none; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.ibtn {
  width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-s); color: var(--text-2); transition: background var(--dur), color var(--dur); flex: none;
}
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn.on { background: rgba(var(--accent-rgb), .16); color: var(--accent); }
.ibtn.sm { width: 26px; height: 26px; }
.input, select.input {
  height: 30px; padding: 0 10px; border-radius: var(--radius-s); border: 1px solid var(--border-strong);
  background: var(--input); outline: none; min-width: 0; transition: border-color var(--dur), box-shadow var(--dur);
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .18); }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
select.input { padding-right: 6px; }
.switch { position: relative; width: 36px; height: 20px; flex: none; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 20px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background var(--dur); }
.switch span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; border-radius: 50%; background: var(--text-2); transition: transform var(--dur) var(--ease), background var(--dur); }
.switch input:checked + span { background: var(--accent); border-color: transparent; }
.switch input:checked + span::after { transform: translateX(16px); background: #fff; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; background: var(--surface-3); outline: none; accent-color: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
input[type=checkbox].cb { accent-color: var(--accent); width: 15px; height: 15px; }
.kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-2); }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.sep { width: 1px; align-self: stretch; background: var(--border); margin: 4px 2px; }
.hsep { height: 1px; background: var(--border); margin: 6px 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); height: 100%; text-align: center; padding: 24px; }
.empty svg.i { width: 40px; height: 40px; stroke-width: 1.25; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: var(--radius-s); padding: 2px; gap: 2px; border: 1px solid var(--border); }
.seg button { height: 24px; padding: 0 10px; border-radius: 4px; color: var(--text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-3); color: var(--text-2); font-weight: 500; }
.badge.accent { background: rgba(var(--accent-rgb), .16); color: var(--accent); }
.avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; flex: none; background-size: cover; background-position: center; }

/* app icon tiles */
.appicon { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 22%; color: #fff; flex: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.25); }
.appicon svg.i { width: 56%; height: 56%; stroke-width: 1.9; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
.fileicon { flex: none; display: block; }

/* ============ boot / login / lock ============ */
#boot { position: fixed; inset: 0; background: #000; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; color: #fff; transition: opacity .5s; }
#boot .logo { width: 72px; height: 72px; }
#boot .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 3px; transition: width .25s; }
#boot .log { position: absolute; left: 24px; bottom: 20px; font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,.35); white-space: pre; line-height: 1.6; }
#boot.hide { opacity: 0; pointer-events: none; }
.oslogo { display: block; }

#power-off { position: fixed; inset: 0; background: #000; z-index: 100001; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; color: rgba(255,255,255,.5); }
#power-off.show { display: flex; }
#power-off button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); color: #fff; display: flex; align-items: center; justify-content: center; }
#power-off button:hover { background: rgba(255,255,255,.08); }
#power-off svg.i { width: 26px; height: 26px; }

#login { position: fixed; inset: 0; z-index: 90000; display: none; color: #fff; background-size: cover; background-position: center; }
#login.show { display: block; }
#login::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(40px) saturate(1.2); -webkit-backdrop-filter: blur(40px) saturate(1.2); }
#login .clock { position: absolute; top: 12%; left: 0; right: 0; text-align: center; transition: transform .45s var(--ease), opacity .45s; }
#login .clock .t { font-size: 96px; font-weight: 600; letter-spacing: -3px; line-height: 1; }
#login .clock .d { font-size: 20px; font-weight: 500; margin-top: 10px; opacity: .85; }
#login .panel { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 14px; width: 320px; transition: opacity .3s; }
#login .panel .avatar { width: 96px; height: 96px; font-size: 36px; box-shadow: 0 8px 30px rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.25); }
#login .panel .name { font-size: 22px; font-weight: 600; }
#login .pw { display: flex; width: 260px; height: 38px; border-radius: 19px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); overflow: hidden; }
#login .pw input { flex: 1; min-width: 0; background: none; border: none; outline: none; padding: 0 16px; color: #fff; font-size: 14px; }
#login .pw input::placeholder { color: rgba(255,255,255,.6); }
#login .pw button { width: 38px; color: #fff; display: flex; align-items: center; justify-content: center; }
#login .pw button:hover { background: rgba(255,255,255,.12); }
#login .err { color: #fecaca; font-size: 12px; min-height: 16px; }
#login .hint { font-size: 12px; opacity: .7; }
#login .users { position: absolute; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 4px; }
#login .users button { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 10px; color: #fff; text-align: left; }
#login .users button:hover, #login .users button.on { background: rgba(255,255,255,.14); }
#login .users .avatar { width: 32px; height: 32px; font-size: 13px; }
#login .power { position: absolute; right: 24px; bottom: 24px; display: flex; gap: 6px; }
#login .power button { width: 38px; height: 38px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; }
#login .power button:hover { background: rgba(255,255,255,.14); }
#login .shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
#login.locked-view .panel { opacity: 0; pointer-events: none; }
#login.locked-view .users { display: none; }
#login:not(.locked-view) .clock { transform: translateY(-40px) scale(.7); opacity: .0; }
#login .unlock-hint { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .7; }
#login:not(.locked-view) .unlock-hint { display: none; }

/* ============ desktop ============ */
#desktop { position: fixed; inset: 0; overflow: hidden; background: #111 center/cover no-repeat; }
#wallpaper { position: absolute; inset: 0; background: #111 center/cover no-repeat; transition: background .4s; }
#screen-filter { position: fixed; inset: 0; pointer-events: none; z-index: 99990; transition: background .4s; }
#desk-icons { position: absolute; inset: 0; }
.dicon { position: absolute; width: 86px; padding: 6px 4px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid transparent; }
.dicon:hover { background: rgba(255,255,255,.1); }
.dicon.sel { background: rgba(var(--accent-rgb), .3); border-color: rgba(var(--accent-rgb), .55); }
.dicon .lbl { font-size: 12px; color: #fff; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.9); word-break: break-word; line-height: 1.25; max-height: 2.5em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dicon.sel .lbl { max-height: none; -webkit-line-clamp: unset; }
.dicon.cut { opacity: .5; }
.dicon .fi { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
.rubber { position: absolute; border: 1px solid rgba(var(--accent-rgb), .9); background: rgba(var(--accent-rgb), .18); z-index: 5; pointer-events: none; }
#drop-overlay { position: fixed; inset: 0; z-index: 99000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); pointer-events: none; }
#drop-overlay.show { display: flex; }
#drop-overlay div { padding: 28px 40px; border-radius: 16px; border: 2px dashed rgba(255,255,255,.6); color: #fff; font-size: 16px; font-weight: 500; background: rgba(0,0,0,.35); display: flex; gap: 12px; align-items: center; }

/* ============ taskbar (windows-like) ============ */
#taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; z-index: 9000; display: flex; align-items: center; padding: 0 8px; gap: 4px;
  background: var(--glass); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); border-top: 1px solid var(--border); transition: transform .25s var(--ease); }
#taskbar.top { top: 0; bottom: auto; border-top: none; border-bottom: 1px solid var(--border); }
#taskbar .tb-left, #taskbar .tb-right { display: flex; align-items: center; gap: 2px; height: 100%; }
#taskbar .tb-center { flex: 1; display: flex; align-items: center; gap: 2px; height: 100%; min-width: 0; }
#taskbar.center .tb-center { justify-content: center; }
#taskbar.center .tb-left { position: absolute; left: 8px; }
#taskbar.center .tb-center .tb-start-group { display: flex; }
.tb-start-group { display: none; gap: 2px; }
.tb-btn { height: 40px; min-width: 40px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); position: relative; }
.tb-btn:hover { background: var(--hover); }
.tb-btn.on { background: var(--active); }
.tb-btn svg.i { width: 18px; height: 18px; }
.tb-app .appicon { width: 26px; height: 26px; border-radius: 7px; }
.tb-app::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 0; height: 3px; border-radius: 3px; background: var(--text-3); transform: translateX(-50%); transition: width .2s var(--ease), background .2s; }
.tb-app.running::after { width: 6px; }
.tb-app.focused::after { width: 16px; background: var(--accent); }
.tb-app.focused { background: var(--hover); }
.tb-app .cnt { position: absolute; top: 3px; right: 3px; font-size: 9px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--surface-3); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-weight: 600; border: 1px solid var(--border); }
.tb-app.attn { animation: attn 1s 3; }
@keyframes attn { 50% { background: rgba(var(--accent-rgb), .35); } }
.tb-search { height: 34px; width: 210px; border-radius: 17px; background: var(--hover); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--text-3); }
.tb-search:hover { background: var(--active); }
.tb-tray { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 6px; border-radius: 6px; color: var(--text); }
.tb-tray:hover { background: var(--hover); }
.tb-tray svg.i { width: 15px; height: 15px; }
.tb-clock { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; height: 40px; padding: 0 8px; border-radius: 6px; font-size: 12px; line-height: 1.3; position: relative; }
.tb-clock:hover { background: var(--hover); }
.tb-clock .dot { position: absolute; top: 6px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
.tb-clock.has-notif .dot { display: block; }
.tb-showdesk { width: 8px; height: 100%; margin-left: 4px; border-left: 1px solid var(--border); }
.tb-showdesk:hover { background: var(--hover); }
.ws-pills { display: flex; gap: 3px; padding: 0 6px; height: 40px; align-items: center; border-radius: 6px; }
.ws-pills:hover { background: var(--hover); }
.ws-pills i { width: 7px; height: 7px; border-radius: 4px; background: var(--text-3); transition: width .2s var(--ease), background .2s; }
.ws-pills i.on { width: 18px; background: var(--accent); }
.ws-pills i.has { background: var(--text-2); }
.ws-pills i.on.has, .ws-pills i.on { background: var(--accent); }
#taskbar.autohide { transform: translateY(100%); }
#taskbar.autohide.top { transform: translateY(-100%); }
#taskbar.autohide.peek { transform: none; }
#tb-hotzone { position: fixed; left: 0; right: 0; height: 4px; bottom: 0; z-index: 8999; display: none; }

/* ============ menubar + dock (mac-like) ============ */
#menubar { position: fixed; top: 0; left: 0; right: 0; height: 30px; z-index: 9000; display: none; align-items: center; padding: 0 8px; gap: 2px;
  background: var(--glass); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); border-bottom: 1px solid var(--border); font-size: 13px; }
#menubar .mb-item { height: 24px; padding: 0 10px; border-radius: 5px; display: flex; align-items: center; gap: 6px; }
#menubar .mb-item:hover, #menubar .mb-item.on { background: var(--active); }
#menubar .mb-app { font-weight: 600; }
#menubar .mb-spacer { flex: 1; }
#menubar svg.i { width: 15px; height: 15px; }
#dock-wrap { position: fixed; left: 0; right: 0; bottom: 6px; z-index: 9000; display: none; justify-content: center; pointer-events: none; transition: transform .25s var(--ease); }
#dock { pointer-events: auto; display: flex; align-items: flex-end; gap: 4px; padding: 6px 8px; border-radius: 18px; height: 66px;
  background: var(--glass); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); border: 1px solid var(--border-strong); box-shadow: var(--shadow-s); }
.dock-item { position: relative; width: 50px; height: 50px; display: flex; align-items: flex-end; justify-content: center; transition: width .12s, height .12s; }
.dock-item .appicon { width: 100%; height: 100%; border-radius: 23%; transition: transform .15s; }
.dock-item:active .appicon { filter: brightness(.8); }
.dock-item .tip { position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: var(--glass-strong); border: 1px solid var(--border); font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; box-shadow: var(--shadow-s); }
.dock-item:hover .tip { opacity: 1; }
.dock-item::after { content: ""; position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; border-radius: 50%; background: var(--text); transform: translateX(-50%); opacity: 0; }
.dock-item.running::after { opacity: .8; }
.dock-sep { width: 1px; height: 44px; background: var(--border-strong); margin: 0 4px; align-self: center; }
.dock-item.bounce .appicon { animation: dbounce .6s 2; }
@keyframes dbounce { 40% { transform: translateY(-14px); } }

/* ============ popovers / flyouts ============ */
.flyout { position: fixed; z-index: 9500; background: var(--glass); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8);
  border: 1px solid var(--border-strong); border-radius: var(--radius-l); box-shadow: var(--shadow); color: var(--text);
  animation: flyin .18s var(--ease); }

/* start menu */
#startmenu { width: 620px; height: 640px; max-height: calc(100vh - 70px); display: flex; flex-direction: column; overflow: hidden; }
#startmenu .sm-search { padding: 20px 24px 8px; }

#startmenu .sm-search .si { position: absolute; margin: 10px 0 0 14px; color: var(--text-3); }
#startmenu .sm-body { flex: 1; overflow-y: auto; padding: 8px 24px 16px; }

.sm-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.sm-app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 8px; font-size: 12px; text-align: center; }

.sm-letter { font-size: 12px; color: var(--accent); font-weight: 600; padding: 10px 10px 4px; }
.sm-recent { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }

#startmenu .sm-foot { height: 60px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: var(--hover); }
.sm-user { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; }
.sm-user:hover { background: var(--hover); }
.sm-user .avatar { width: 30px; height: 30px; font-size: 12px; }

/* quick settings */
#quicksettings { width: 360px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.qs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qs-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); text-align: center; }
.qs-tile button { width: 100%; height: 48px; border-radius: 10px; background: var(--hover); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text); }
.qs-tile button:hover { background: var(--active); }
.qs-tile.on button { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.qs-tile svg.i { width: 18px; height: 18px; }
.qs-slider { display: flex; align-items: center; gap: 12px; }
.qs-slider input { flex: 1; }

.qs-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-2); }

/* calendar + notifications */
#calendar-fly { width: 340px; display: flex; flex-direction: column; max-height: calc(100vh - 70px); }
#calendar-fly .notifs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 90px; max-height: 340px; }
#calendar-fly .nhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 0; font-weight: 600; }
.cal { padding: 14px; border-top: 1px solid var(--border); }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12px; }
.cal-grid .dow { color: var(--text-3); font-size: 11px; padding: 4px 0; }

.cal-grid .d:hover { background: var(--hover); }

.cal-today { font-size: 13px; color: var(--text-2); padding: 14px 14px 0; border-top: 1px solid var(--border); }
.notif { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; position: relative; }
.notif .appicon { width: 20px; height: 20px; border-radius: 5px; }
.notif .nt { font-weight: 600; font-size: 12.5px; }
.notif .nb { font-size: 12px; color: var(--text-2); margin-top: 2px; word-break: break-word; }
.notif .nm { font-size: 11px; color: var(--text-3); }
.notif .x { position: absolute; top: 6px; right: 6px; opacity: 0; }
.notif:hover .x { opacity: 1; }
.notif .acts { display: flex; gap: 6px; margin-top: 8px; }

/* toasts */
#toasts { position: fixed; right: 14px; bottom: 62px; z-index: 9400; display: flex; flex-direction: column-reverse; gap: 8px; pointer-events: none; }
body.dockmode #toasts { top: 40px; bottom: auto; flex-direction: column; }
.toast { pointer-events: auto; width: 360px; background: var(--glass-strong); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; gap: 12px; animation: toastin .3s var(--ease); cursor: default; }
.toast .appicon { width: 32px; height: 32px; border-radius: 8px; }
.toast.out { animation: toastout .25s forwards; }
@keyframes toastin { from { opacity: 0; transform: translateX(30px); } }
@keyframes toastout { to { opacity: 0; transform: translateX(30px); } }

/* context menu */
.cmenu { position: fixed; z-index: 99600; min-width: 220px; padding: 5px; background: var(--glass-strong); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
  border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow); animation: cmin .12s var(--ease); font-size: 13px; }
@keyframes cmin { from { opacity: 0; transform: scale(.97); } }
.cmenu .mi { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 6px; position: relative; white-space: nowrap; }
.cmenu .mi:hover:not(.dis), .cmenu .mi.kb { background: var(--accent); color: var(--accent-fg); }

.cmenu .ms { height: 1px; background: var(--border); margin: 5px 6px; }
.cmenu .mh { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .4px; }
.cmenu .arrow { margin-left: auto; padding-left: 16px; display: flex; }

/* dialogs */
.modal-back { position: fixed; inset: 0; z-index: 99700; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; animation: fadein .15s; }

@keyframes fadein { from { opacity: 0; } }
.dialog { min-width: 380px; max-width: min(560px, 92vw); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-l); box-shadow: var(--shadow); animation: dlgin .2s var(--ease); display: flex; flex-direction: column; max-height: 90vh; }
@keyframes dlgin { from { opacity: 0; transform: scale(.96); } }
.dialog .dh { display: flex; align-items: flex-start; gap: 14px; padding: 20px 20px 4px; }
.dialog .dh .dic { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; background: rgba(var(--accent-rgb), .14); color: var(--accent); }
.dialog .dh .dic.warn { background: rgba(245,158,11,.14); color: var(--warning); }
.dialog .dh .dic.danger { background: rgba(239,68,68,.14); color: var(--danger); }
.dialog .dh .dic svg.i { width: 18px; height: 18px; }
.dialog .dt { font-size: 15px; font-weight: 600; }
.dialog .dm { color: var(--text-2); margin-top: 4px; line-height: 1.5; word-break: break-word; }
.dialog .db { padding: 12px 20px; overflow-y: auto; }
.dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; }
.dialog .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.dialog .field label { font-size: 12px; color: var(--text-2); font-weight: 500; }

/* launcher / spotlight */
#launcher { position: fixed; inset: 0; z-index: 99400; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; background: rgba(0,0,0,.18); }
#launcher.show { display: flex; }
#launcher .box { width: 640px; max-width: 92vw; background: var(--glass-strong); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; animation: dlgin .18s var(--ease); }
#launcher .q { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 56px; }

#launcher .res:empty { display: none; }
#launcher .grp { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; padding: 10px 12px 4px; }

#launcher .it .sub { font-size: 11.5px; color: var(--text-3); }
#launcher .it.kb { background: var(--accent); color: var(--accent-fg); }
#launcher .it.kb .sub { color: rgba(255,255,255,.75); }
#launcher .it .hint { margin-left: auto; font-size: 11px; color: var(--text-3); }
#launcher .it.kb .hint { color: rgba(255,255,255,.75); }
#launcher .foot { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3); }

/* alt-tab switcher */
#switcher { position: fixed; inset: 0; z-index: 99300; display: none; align-items: center; justify-content: center; pointer-events: none; }
#switcher.show { display: flex; }
#switcher .sw { display: flex; gap: 8px; padding: 14px; background: var(--glass-strong); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: var(--shadow); max-width: 90vw; flex-wrap: wrap; justify-content: center; }
#switcher .si { width: 120px; padding: 12px 8px 8px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 2px solid transparent; }
#switcher .si.on { border-color: var(--accent); background: rgba(var(--accent-rgb), .12); }
#switcher .si .appicon { width: 56px; height: 56px; }
#switcher .si span { font-size: 11.5px; max-width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* overview / task view */
#overview { position: fixed; inset: 0; z-index: 8500; display: none; background: rgba(0,0,0,.45); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
#overview.show { display: block; animation: fadein .2s; }
#overview .ov-ws { position: absolute; top: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
.ov-wsi { width: 168px; height: 110px; border-radius: 10px; border: 2px solid rgba(255,255,255,.15); background: #222 center/cover; position: relative; overflow: hidden; color: #fff; }
.ov-wsi.on { border-color: var(--accent); }
.ov-wsi.drop { border-color: #fff; transform: scale(1.04); }
.ov-wsi .lbl { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: 11.5px; background: linear-gradient(transparent, rgba(0,0,0,.65)); display: flex; justify-content: space-between; }
.ov-wsi .mini { position: absolute; border-radius: 2px; background: rgba(255,255,255,.7); border: 1px solid rgba(0,0,0,.2); }
.ov-wsi.add { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.06); }
.ov-wsi .x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
.ov-wsi:hover .x { display: flex; }
#overview .ov-wins { position: absolute; top: 160px; left: 40px; right: 40px; bottom: 40px; }
.ov-win { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .2s; }
.ov-win .thumb { border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5); border: 2px solid transparent; background: var(--surface); position: relative; }
.ov-win:hover .thumb { border-color: var(--accent); }
.ov-win .cap { display: flex; gap: 8px; align-items: center; color: #fff; font-size: 12.5px; max-width: 100%; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.ov-win .cap .appicon { width: 20px; height: 20px; border-radius: 5px; }
.ov-win .close { position: absolute; top: -10px; right: -10px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-3); color: var(--text); display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-s); }
.ov-win:hover .close { display: flex; }
.ov-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.6); font-size: 15px; }

/* snap preview + layouts */
#snap-preview { position: fixed; z-index: 8000; border-radius: 12px; background: rgba(var(--accent-rgb), .18); border: 2px solid rgba(var(--accent-rgb), .5); backdrop-filter: blur(6px); pointer-events: none; display: none; transition: all .15s var(--ease); }
#snap-layouts { position: fixed; z-index: 99200; padding: 10px; display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; }
.sl { height: 52px; display: grid; gap: 3px; }
.sl i { background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 4px; }
.sl i:hover { background: var(--accent); border-color: var(--accent); }

/* ============ windows ============ */
#windows { position: absolute; inset: 0; pointer-events: none; }
.win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--win-radius);
  border: 1px solid var(--border-strong); box-shadow: var(--shadow); overflow: hidden; min-width: 280px; min-height: 160px;
  transition: box-shadow var(--dur); }
.win.inactive { box-shadow: 0 8px 28px rgba(0,0,0,.28); }
.win.max { border-radius: 0; border-width: 0; }
.win.snapped { border-radius: 4px; }
.win.anim { transition: left .22s var(--ease), top .22s var(--ease), width .22s var(--ease), height .22s var(--ease), transform .22s var(--ease), opacity .22s; }
.win.opening { animation: winopen .2s var(--ease); }
@keyframes winopen { from { opacity: 0; transform: scale(.95); } }
.win.closing { animation: winclose .16s forwards; pointer-events: none; }
@keyframes winclose { to { opacity: 0; transform: scale(.95); } }
.win.minimized { display: none; }
.win.hidden-ws { display: none; }
.titlebar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; }
.win.inactive .titlebar { color: var(--text-2); }
.titlebar .t-icon .appicon { width: 18px; height: 18px; border-radius: 5px; }
.titlebar .t-title { flex: 1; min-width: 0; font-weight: 500; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titlebar .t-tools { display: flex; align-items: center; gap: 2px; }
.titlebar.custom { padding-left: 8px; }
.wctl { display: flex; align-items: center; height: 100%; }
.wctl button { width: 44px; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-2); }
.wctl button:hover { background: var(--hover); color: var(--text); }
.wctl button.close:hover { background: #e81123; color: #fff; }
.wctl svg.i { width: 14px; height: 14px; stroke-width: 1.5; }
.titlebar .wctl { margin-right: -6px; }
/* mac-style traffic lights when layout=left */
html.btn-left .wctl { order: -1; gap: 8px; padding: 0 4px 0 0; margin-right: 0; }
html.btn-left .titlebar { padding-left: 12px; }
html.btn-left .wctl button { width: 13px; height: 13px; border-radius: 50%; padding: 0; }
html.btn-left .wctl button svg { opacity: 0; width: 9px; height: 9px; stroke-width: 2.5; color: rgba(0,0,0,.6); }
html.btn-left .wctl:hover button svg { opacity: 1; }
html.btn-left .wctl button.close { background: #ff5f57; order: 1; }
html.btn-left .wctl button.min { background: #febc2e; order: 2; }
html.btn-left .wctl button.max { background: #28c840; order: 3; }
html.btn-left .wctl button:hover { color: inherit; }
html.btn-left .wctl button.close:hover { background: #ff5f57; }
html.btn-left .win.inactive .wctl button { background: var(--surface-3); }
html.btn-left .titlebar .t-title { text-align: center; }
html.btn-left .titlebar .t-icon { display: none; }
.win-body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; background: var(--surface); }
.rz { position: absolute; z-index: 20; }
.rz.n { top: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
.rz.s { bottom: -3px; left: 8px; right: 8px; height: 7px; cursor: ns-resize; }
.rz.e { right: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
.rz.w { left: -3px; top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; }
.rz.ne { right: -3px; top: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
.rz.nw { left: -3px; top: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.rz.se { right: -3px; bottom: -3px; width: 12px; height: 12px; cursor: nwse-resize; }
.rz.sw { left: -3px; bottom: -3px; width: 12px; height: 12px; cursor: nesw-resize; }
.win.max .rz { display: none; }
body.dragging, body.dragging * { cursor: default !important; }
body.dragging iframe, body.resizing iframe { pointer-events: none; }
body.resizing.rz-ns * { cursor: ns-resize !important; }
body.resizing.rz-ew * { cursor: ew-resize !important; }
body.resizing.rz-nesw * { cursor: nesw-resize !important; }
body.resizing.rz-nwse * { cursor: nwse-resize !important; }

/* common app layout pieces */
.toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex: none; background: var(--surface); }
.statusbar { display: flex; align-items: center; gap: 14px; padding: 0 12px; height: 26px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-2); flex: none; background: var(--surface); }
.sidebar { width: 210px; flex: none; background: var(--sidebar); border-right: 1px solid var(--border); overflow-y: auto; padding: 8px; }
.sb-h { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 12px 10px 4px; text-transform: uppercase; letter-spacing: .4px; }
.sb-i { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 6px; color: var(--text); white-space: nowrap; overflow: hidden; }

.sb-i:hover { background: var(--hover); }
.sb-i.on { background: rgba(var(--accent-rgb), .15); color: var(--accent); }
.sb-i.on svg.i { color: var(--accent); }
.sb-i.drop { outline: 2px solid var(--accent); }
.tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 6px 0; background: var(--surface-2); border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; scrollbar-width: none; }
.tab { height: 32px; min-width: 120px; max-width: 220px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-radius: 8px 8px 0 0; color: var(--text-2); font-size: 12.5px; position: relative; flex: 1 1 180px; }

.cam-flash.go { animation: camflash .35s; }
@keyframes camflash { 0% { opacity: .9; } 100% { opacity: 0; } }
.cam-count { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 120px; font-weight: 700; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,.5); pointer-events: none; }

/* ============ 2048 ============ */
.g2-wrap { flex: 1; display: flex; flex-direction: column; padding: 18px; gap: 12px; background: #faf8ef; color: #776e65; overflow: auto; }

.g2-tile { position: absolute; width: calc((94% - 9%) / 4); height: calc((94% - 9%) / 4); left: calc(3% + var(--x) * ((94% - 9%) / 4 + 3%)); top: calc(3% + var(--y) * ((94% - 9%) / 4 + 3%)); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(16px, 7cqw, 40px); transition: left .11s ease-in-out, top .11s ease-in-out; background: #eee4da; color: #776e65; container-type: size; }
.g2-tile.new { animation: g2new .2s ease .1s backwards; } .g2-tile.merged { animation: g2pop .2s ease; }
@keyframes g2new { from { transform: scale(0); } } @keyframes g2pop { 50% { transform: scale(1.15); } }
.g2-tile[data-v="4"] { background: #ede0c8; } .g2-tile[data-v="8"] { background: #f2b179; color: #fff; } .g2-tile[data-v="16"] { background: #f59563; color: #fff; } .g2-tile[data-v="32"] { background: #f67c5f; color: #fff; } .g2-tile[data-v="64"] { background: #f65e3b; color: #fff; } .g2-tile[data-v="128"] { background: #edcf72; color: #fff; font-size: 30px; } .g2-tile[data-v="256"] { background: #edcc61; color: #fff; font-size: 30px; } .g2-tile[data-v="512"] { background: #edc850; color: #fff; font-size: 30px; } .g2-tile[data-v="1024"] { background: #edc53f; color: #fff; font-size: 24px; } .g2-tile[data-v="2048"] { background: #edc22e; color: #fff; font-size: 24px; box-shadow: 0 0 30px #edc22e; }
.g2-msg { position: absolute; inset: 0; border-radius: 10px; background: rgba(238,228,218,.75); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 5; color: #776e65; text-align: center; } .g2-msg.show { display: flex; animation: fadein .5s; } .g2-msg.win { background: rgba(237,194,46,.6); color: #fff; } .g2-msg h2 { font-size: 34px; }

/* ============ KaranSweeper ============ */
.ms-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; }

.ms-face { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; color: #ca8a04; } .ms-face svg.i { width: 26px; height: 26px; }

@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.9); } }

K.users = (function () {
  const V = K.vfs, R = V.ROOTCTX;
  const read = p => { try { const d = V.readFile(p, R); return typeof d === 'string' ? d : ''; } catch (e) { return ''; } };
  const lines = p => read(p).split('\n').filter(l => l.trim() && !l.startsWith('#'));

  function passwd() { return lines('/etc/passwd').map(l => { const [name, , uid, gid, gecos, home, shell] = l.split(':'); return { name, uid: +uid, gid: +gid, gecos: gecos || '', fullName: (gecos || '').split(',')[0] || name, home, shell }; }); }
  function groups() { return lines('/etc/group').map(l => { const [name, , gid, mem] = l.split(':'); return { name, gid: +gid, members: (mem || '').split(',').filter(Boolean) }; }); }
  function shadow() { const o = {}; lines('/etc/shadow').forEach(l => { const [name, hash, last] = l.split(':'); o[name] = { hash, last }; }); return o; }

  const api = {
    list: () => passwd(),
    humans: () => passwd().filter(u => u.uid >= 1000 && u.uid < 60000),
    get: name => passwd().find(u => u.name === name) || null,
    byUid: uid => passwd().find(u => u.uid === uid) || null,
    groups: () => groups(),
    group: name => groups().find(g => g.name === name) || null,
    groupByGid: gid => groups().find(g => g.gid === gid) || null,
    nameOf: uid => { const u = api.byUid(uid); return u ? u.name : String(uid); },
    groupNameOf: gid => { const g = api.groupByGid(gid); return g ? g.name : String(gid); },
    gidsOf(name) { const u = api.get(name); if (!u) return []; const s = new Set([u.gid]); groups().forEach(g => { if (g.members.includes(name)) s.add(g.gid); }); return [...s]; },
    groupNamesOf(name) { return api.gidsOf(name).map(api.groupNameOf); },
    isAdmin(name) { const u = api.get(name); if (!u) return false; if (u.uid === 0) return true; return api.groupNamesOf(name).some(g => g === 'sudo' || g === 'wheel'); },
    ctxFor(name, cwd) { const u = api.get(name); if (!u) throw Error('no such user: ' + name); return { uid: u.uid, gid: u.gid, groups: api.gidsOf(name), cwd: cwd || u.home, user: u.name, home: u.home, umask: 0o022 }; },
    color(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; },
    initials(u) { const n = (u.fullName || u.name).trim().split(/\s+/); return ((n[0] || '')[0] + (n.length > 1 ? n[n.length - 1][0] : '')).toUpperCase(); },
    avatarEl(u, size = 32) {
      const el = K.h('div.avatar', { style: { width: size + 'px', height: size + 'px', fontSize: Math.round(size * .38) + 'px', background: api.color(u.name) } }, api.initials(u));
      const face = u.home + '/.face';
      if (V.exists(face)) V.readURL(face).then(url => { el.style.backgroundImage = `url(${url})`; el.textContent = ''; }).catch(() => {});

    },
    hasPassword(name) { const s = shadow()[name]; return !!(s && s.hash && s.hash !== '!' && s.hash !== '*' && s.hash !== ''); },
    isLocked(name) { const s = shadow()[name]; return !s || s.hash.startsWith('!') || s.hash === '*'; },
    async verify(name, pw) {

    async setPassword(name, pw) {

      sh[name] = { hash: pw === '' ? '' : `$5$${salt}$${await K.hash(salt + ':' + pw)}`, last: Math.floor(Date.now() / 864e5) };

    },
    lock(name, on) { const sh = shadow(); if (!sh[name]) return; if (on && !sh[name].hash.startsWith('!')) sh[name].hash = '!' + sh[name].hash; if (!on && sh[name].hash.startsWith('!')) sh[name].hash = sh[name].hash.slice(1); writeShadow(sh); },
    async add(name, opts = {}) {

    },
    createHome(name) {
      const u = api.get(name); if (!u || V.exists(u.home)) return;

      try { V.readdir('/etc/skel', R).forEach(e => V.copy(e.path, u.home + '/' + e.name, R, { recursive: true })); } catch (e) {}
      ['Desktop', 'Documents', 'Downloads', 'Music', 'Pictures', 'Videos', 'Public', 'Templates', '.config', '.local', '.local/share', '.local/share/Trash', '.local/share/Trash/files', '.local/share/Trash/info'].forEach(d => { const p = u.home + '/' + d; if (!V.exists(p)) V.mkdir(p, R); });

    },
    modify(name, changes) {

    },
    setGroups(name, names, append) {
      const gl = groups();
      names.forEach(n => { if (!gl.some(g => g.name === n)) throw Error(`group '${n}' does not exist`); });
      gl.forEach(g => { const has = g.members.includes(name); const want = names.includes(g.name); if (want && !has) g.members.push(name); if (!want && has && !append) g.members = g.members.filter(m => m !== name); });

    addToGroup(name, group) { api.setGroups(name, [group], true); },
    removeFromGroup(name, group) { const gl = groups(); const g = gl.find(x => x.name === group); if (!g) throw Error(`group '${group}' does not exist`); g.members = g.members.filter(m => m !== name); writeGroups(gl); K.emit('users:change'); },

})();

    const boot = K.$('#boot'); const bar = K.$('#boot .bar i'); const log = K.$('#boot .log');
    const step = (pct, msg) => { bar.style.width = pct + '%'; log.textContent += msg + '\n'; };

    const fresh = await K.vfs.init();
    step(35, `[  OK  ] Mounted root filesystem (${K.vfs.persistent() ? 'indexeddb' : 'tmpfs, not persistent'})`);
    if (fresh) { step(45, '[  OK  ] First boot: creating filesystem layout'); await K.seedFS(); }

    boot.classList.add('hide'); setTimeout(() => boot.remove(), 600);

  };

    const t = K.h('div.t'), d = K.h('div.d');
    const tick = () => { const n = new Date(); t.textContent = n.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: !(K.settings && K.settings.get('clock24')) }).replace(/\s?[AP]M/i, ''); d.textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); };

    el.append(panel);
    if (humans.length > 1 || api.locked) {
      el.append(K.h('div.users', humans.map(h => K.h('button' + (h.name === u.name ? '.on' : ''), { onclick: () => { selectedUser = h.name; renderLogin(false); } }, K.users.avatarEl(h, 32), K.h('span', h.fullName || h.name)))));
    }

      K.h('button', { title: 'Shut down', html: K.icon('power'), onclick: () => api.shutdown() })));
    const reveal = () => { el.classList.remove('locked-view'); setTimeout(() => pw.focus(), 50); };
    if (lockedView) {
      const h = e => { if (!el.classList.contains('locked-view')) return; if (e.type === 'keydown' && (e.key === 'Shift' || e.key === 'Alt' || e.key === 'Control' || e.key === 'Meta')) return; reveal(); };
      el.addEventListener('mousedown', h); el.addEventListener('keydown', h); el.tabIndex = -1; el.focus();

  api.unlock = function () { api.locked = false; K.motion.unlock(); clearInterval(clockTimer); K.emit('session:unlock'); };

  api.restart = async function () { if (api.user && await api.logout(true) === false) return; K.vfs.flushNow(); setTimeout(() => location.reload(), 300); };
  api.shutdown = async function () {

    const body = K.h('div', asSelf ? null : K.h('div.field', K.h('label', 'Administrator'), who), K.h('div.field', K.h('label', 'Password for ' + (asSelf ? api.user.name : 'administrator')), pw), err);
    const ok = await K.ui.dialog({

      buttons: [{ label: 'Cancel', value: false }, { label: 'Authenticate', primary: true, value: true, validate: async () => { const n = asSelf ? api.user.name : who.value; const good = await K.users.verify(n, pw.value); if (!good) { err.textContent = 'Sorry, that didn’t work. Please try again.'; pw.select(); } return good; } }]
    });

    d += ` Q ${c[0].toFixed(2)} ${c[1].toFixed(2)} ${p1[0].toFixed(2)} ${p1[1].toFixed(2)}`;

/* ============ Launchpad: every app, full screen ============ */
K.launchpad = (function () {
  let el = null, cat = 'All';
  const CATS = { All: null, System: ['files', 'terminal', 'settings', 'monitor'], Internet: ['browser'], Productivity: ['editor', 'notes', 'calculator', 'clock'], Media: ['music', 'video', 'photos', 'camera', 'paint'], Games: ['racer', 'game2048', 'mines', 'snake'] };

  }
  function open() {
    if (el || !K.session.user) return; K.shell.closeFly(); K.search.close();
    const q = K.h('input.lp-q', { placeholder: 'Search apps', spellcheck: false });
    const grid = K.h('div.lp-grid'); const chips = K.h('div.lp-chips'); const count = K.h('div.lp-count');
    el = K.h('div#launchpad', K.h('div.lp-top', K.h('div.lp-search', K.iconEl('search', 16), q), chips), grid, count);
    function render() {
      chips.innerHTML = ''; Object.keys(CATS).forEach(c => chips.append(K.h('button.lp-chip' + (c === cat ? '.on' : ''), { onclick: () => { cat = c; render(); } }, c)));
      const s = q.value.trim().toLowerCase();
      const apps = K.apps.list().filter(a => (!CATS[cat] || CATS[cat].includes(a.id)) && (!s || (a.name + ' ' + (a.keywords || '') + ' ' + (a.description || '')).toLowerCase().includes(s)));
      grid.innerHTML = '';
      apps.forEach((a, i) => {
        const it = K.h('button.lp-app', { style: { animationDelay: Math.min(i * 18, 300) + 'ms' }, title: a.description || a.name, onclick: e => { K.motion.pop(it.firstChild); close(() => K.apps.launch(a.id)); },

})();

/* ============ Karan Keep (notes) ============ */

    const save = K.debounce(() => { try { K.vfs.mkdir(K.path.dirname(file), ctx, { parents: true }); K.vfs.writeFile(file, JSON.stringify(notes), ctx); } catch (e) { K.ui.error(e); } }, 300);

      if (!list.length) { grid.append(K.h('div.empty', K.iconEl('note'), s ? 'No notes match. Maybe you never wrote it down.' : 'No notes. Your memory must be excellent.')); return; }
      list.forEach(n => {
        const title = K.h('input.nk-title', { value: n.title, placeholder: 'Title', oninput: e => { n.title = e.target.value; n.t = Date.now(); save(); } });
        const body = K.h('textarea.nk-body', { value: n.body, placeholder: 'Write something…', oninput: e => { n.body = e.target.value; n.t = Date.now(); grow(); save(); } });
